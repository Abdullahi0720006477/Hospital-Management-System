name: CI/CD Pipeline - Hospital Management System

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-check:
    name: PHP Syntax & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, intl

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Check PHP Syntax
        run: find src/ -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Security Audit
        run: composer audit

  run-tests:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest
    needs: code-check
    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/hospital_test?serverVersion=8.0&charset=utf8mb4"
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hospital_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Prepare Test Database
        run: |
          php bin/console doctrine:schema:create --env=test
          php bin/console app:setup-test-data --env=test --no-interaction

      - name: Run Tests
        run: vendor/bin/phpunit --testdox

  deployment-ready:
    name: Confirm Deployment Readiness
    runs-on: ubuntu-latest
    needs: [code-check, run-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deployment Ready
        run: echo "Hospital Management System passed all required checks."
